name: Record Portfolio History

on:
  schedule:
    # 01:10 UTC = 北京时间 09:10
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Capture portfolio snapshot
        env:
          POLYMARKET_USER_ADDRESSES: ${{ vars.POLYMARKET_USER_ADDRESSES || secrets.POLYMARKET_USER_ADDRESS }}
        run: npm run snapshot

      - name: Commit updated history
        run: |
          if git diff --quiet -- data/portfolio-history.json; then
            echo "History is already current for this UTC day."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-history.json
          git commit -m "data: record daily portfolio snapshot"
          git push
