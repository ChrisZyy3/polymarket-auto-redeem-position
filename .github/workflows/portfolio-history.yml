name: Record Portfolio History

on:
  schedule:
    # 01:10 UTC = 北京时间 09:10
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-history
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Capture portfolio snapshot
        id: capture
        continue-on-error: true
        env:
          POLYMARKET_USER_ADDRESSES: ${{ vars.POLYMARKET_USER_ADDRESSES || secrets.POLYMARKET_USER_ADDRESS }}
        run: npm run snapshot

      - name: Commit updated history
        # Keep successful wallet snapshots even if one wallet was rate-limited.
        if: always() && steps.capture.outcome != 'skipped'
        run: |
          git add data/portfolio-history.json
          if [ -d data/position-history ]; then
            git add data/position-history
          fi
          if git diff --cached --quiet; then
            echo "No new portfolio or position price history."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: record daily portfolio and position prices"
          git push

      - name: Mark partial snapshot runs as failed
        if: steps.capture.outcome == 'failure'
        run: |
          echo "::error::Daily portfolio capture failed for one or more wallets. Successfully captured wallets were committed when available."
          exit 1
